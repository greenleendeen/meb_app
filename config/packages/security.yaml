security:

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users_in_db:
            entity:
                class: App\Entity\User
                property: identifiant

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            provider: users_in_db
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: /intervention
                username_parameter: identifiant
                password_parameter: password
            logout:
                path: app_logout
                target: /login

    access_control:
        # Autorise la page login
        - { path: ^/login$, roles: PUBLIC_ACCESS }

        # Autorise logout
        - { path: ^/logout$, roles: PUBLIC_ACCESS }

        # Protège intervention
        - { path: ^/intervention, roles: ROLE_SUPER_ADMIN }

        # Tout le reste nécessite une connexion
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10